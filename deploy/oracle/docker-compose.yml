# AcademiaPass en una maquina virtual (Oracle Cloud Always Free u otra con Docker).
#   api   : la API y la version web (imagen del Dockerfile de la raiz del repositorio)
#   caddy : HTTPS automatico (Let's Encrypt) para el dominio de DOMAIN, redirige al puerto 8080 de la API
# La base de datos es Neon (DATABASE_URL); la maquina no guarda datos y se puede recrear en cualquier momento.
# Uso: docker compose up -d --build   (las variables se leen de .env en esta carpeta)
services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: academiapass-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
