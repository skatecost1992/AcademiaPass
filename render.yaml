# Blueprint de Render: un solo servicio web con la API y la version web (RQ24, RQ27).
#
# La base de datos es PostgreSQL externo (Neon, gratis y sin vencimiento): la cuenta gratuita de Render solo
# permite una base activa y ya esta en uso. Render > New > Blueprint > este repositorio, y en DATABASE_URL pega
# la cadena de Neon (postgresql://...?sslmode=require).
#
# Misma base para todos: la web (https://<servicio>.onrender.com) y las apps Android/iOS en la opcion "Nube"
# llaman a esta misma API, que usa esta unica DATABASE_URL.
services:
  - type: web
    name: academiapass
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && cd ../app-android && npm ci --legacy-peer-deps && npm run build:web
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # se pide al crear el Blueprint: cadena de conexion de Neon
      - key: ADMIN_SIGNUP_CODE
        sync: false # opcional: si lo defines, solo quien lo conozca puede registrar una organizacion
